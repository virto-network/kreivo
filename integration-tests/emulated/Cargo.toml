[package]
name = "kreivo-emulated-integration-tests"
description = "XCM integration tests between Kreivo and the system chains, on xcm-emulator"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The system chains are the Westend runtimes: the Kusama ones (polkadot-fellows/runtimes) lag
# one SDK release behind Kreivo, so they can't share its dependency graph. From Kreivo's side
# only relative locations matter (the relay is `(1, Here)`, Asset Hub is `(1, [Parachain(1000)])`),
# and those are the same on Westend.

[dependencies]
# Substrate
frame-support = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
sc-consensus-grandpa = { version = "0.44.0" }
sp-authority-discovery = { version = "43.0.0" }
sp-consensus-babe = { version = "0.49.0" }
sp-consensus-beefy = { version = "31.0.0" }
sp-keyring = { version = "48.0.0" }

# Polkadot
polkadot-primitives = { version = "25.0.0" }
westend-runtime = { version = "37.0.0" }
westend-runtime-constants = { version = "32.0.0" }
xcm = { workspace = true, default-features = true }
xcm-builder = { workspace = true, default-features = true }
xcm-executor = { workspace = true, default-features = true }
xcm-runtime-apis = { workspace = true, default-features = true }
pallet-xcm = { workspace = true, default-features = true }

# Cumulus
asset-hub-westend-runtime = { version = "0.54.0" }
cumulus-primitives-core = { workspace = true, default-features = true }
emulated-integration-tests-common = { version = "38.0.0" }
parachains-common = { workspace = true, default-features = true }
testnet-parachains-constants = { version = "25.0.0", features = ["westend"] }

# Kreivo
kreivo-runtime = { workspace = true, default-features = true }
virto-common = { workspace = true, default-features = true }
pallet-assets = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
pallet-communities-manager = { workspace = true, default-features = true }
parity-scale-codec = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }
pallet-message-queue = { workspace = true, default-features = true }

[lints]
workspace = true
