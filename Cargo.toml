[workspace]
members = [
  "apis",
  "chain-spec-generator",
  "common",
  "integration-tests/emulated",
  "runtime/kreivo",
]
resolver = "2"

[profile.release]
panic = "unwind"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true

[profile.test]
debug = 0

[workspace.package]
authors = ['Virto Team <contact@virto.team>']
edition = "2021"
license = "GPL-3.0-only"
repository = 'https://github.com/virto-network/kreivo'

[workspace.dependencies]
# common
anyhow = { version = "1.0.100", default-features = false }
tempfile = { version = "3.23.0" }
toml = { version = "0.9.8" }
twox-hash = { version = "2.1.2", default-features = false }
num_enum = { version = "0.7.3", default-features = false }

clap = { version = "4.5.48" }
log = { version = "0.4.28" }
parity-scale-codec = { version = "3.6.4", default-features = false, features = [
  "derive",
] }
scale-info = { version = "2.10.0", default-features = false, features = [
  "derive",
] }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.145", default-features = false }
smallvec = "1.11"

# Local dependencies
kreivo-runtime = { path = "runtime/kreivo" }

# Virto Pallets
kreivo-apis = { default-features = false, path = "apis" }
virto-common = { default-features = false, path = "common" }

pallet-communities-manager = { default-features = false, path = "pallets/communities-manager" }
pallet-contracts-store = { default-features = false, path = "pallets/contracts-store" }

runtime-constants = { default-features = false, path = "runtime/runtime-constants" }
runtime-common = { default-features = false, path = "runtime/common" }

# Frame Contrib
frame-contrib-traits = { version = "3.0.0-pre.2", default-features = false }
mock-helpers = { version = "3.0.0-pre.2", default-features = false, package = "fc-mock-helpers" }

pallet-communities = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-communities" }
pallet-usage-subscription = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-usage-subscription" }
pallet-listings = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-listings" }
pallet-orders = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-orders" }
pallet-payments = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-payments" }
pallet-pass = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-pass" }
pallet-referenda-tracks = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-referenda-tracks" }
pallet-black-hole = { version = "3.0.0-pre.2", default-features = false, package = "fc-pallet-black-hole" }

# Pass Authenticators
pass-webauthn = { version = "2.0.0-pre.1", default-features = false, package = "pass-authenticators-webauthn" }
pass-substrate-keys = { version = "2.0.0-pre.1", default-features = false, package = "pass-authenticators-substrate-keys" }

# Substrate std
sc-chain-spec = { version = "52.0.0" }

# Substrate non-std
frame-benchmarking = { version = "49.0.0", default-features = false }
sp-api = { version = "43.0.0", default-features = false }
sp-block-builder = { version = "43.0.0", default-features = false }
sp-consensus-aura = { version = "0.49.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-offchain = { version = "43.0.0", default-features = false }
sp-session = { version = "45.0.0", default-features = false }
sp-transaction-pool = { version = "43.0.0", default-features = false }

# Substrate Runtime
sp-genesis-builder = { version = "0.24.0", default-features = false }
sp-inherents = { version = "43.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }
sp-version = { version = "46.0.0", default-features = false }
sp-weights = { version = "36.0.0", default-features = false }

# Build Dependencies
substrate-wasm-builder = { version = "34.0.1" }
parity-wasm = { version = "0.45.0" }

## FRAME Dependencies
frame-executive = { version = "48.0.0", default-features = false }
frame-support = { version = "48.1.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
frame-system-benchmarking = { version = "49.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false }

## FRAME Pallets
pallet-asset-tx-payment = { version = "49.0.0", default-features = false }
pallet-assets = { version = "53.0.0", default-features = false }
pallet-assets-freezer = { version = "0.18.0", default-features = false }
pallet-assets-holder = { version = "0.13.0", default-features = false }
pallet-aura = { version = "48.0.0", default-features = false }
pallet-authorship = { version = "48.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-contracts = { version = "49.0.0", default-features = false }
pallet-contracts-fixtures = { path = "pallets/contracts-store/fixtures", default-features = false }
pallet-multisig = { version = "49.0.0", default-features = false }
pallet-nfts = { version = "43.0.0", default-features = false }
pallet-preimage = { version = "49.0.0", default-features = false }
pallet-proxy = { version = "49.0.0", default-features = false }
pallet-ranked-collective = { version = "49.0.0", default-features = false }
pallet-referenda = { version = "49.0.0", default-features = false }
pallet-scheduler = { version = "50.0.0", default-features = false }
pallet-session = { version = "49.0.0", default-features = false }
pallet-skip-feeless-payment = { version = "23.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }
pallet-treasury = { version = "48.0.0", default-features = false }
pallet-utility = { version = "49.0.1", default-features = false }
pallet-vesting = { version = "49.0.0", default-features = false }

# Cumulus client dependencies
cumulus-primitives-aura = { version = "0.24.0", default-features = false }

# Cumulus runtime dependencies
assets-common = { version = "0.37.0", default-features = false }
cumulus-pallet-aura-ext = { version = "0.30.0", default-features = false }
cumulus-pallet-parachain-system = { version = "0.30.0", default-features = false }
cumulus-pallet-session-benchmarking = { version = "30.0.0", default-features = false }
cumulus-pallet-xcm = { version = "0.27.0", default-features = false }
cumulus-pallet-xcmp-queue = { version = "0.32.0", default-features = false }
cumulus-primitives-core = { version = "0.26.0", default-features = false }
cumulus-primitives-utility = { version = "0.32.0", default-features = false }
pallet-collator-selection = { version = "30.0.0", default-features = false }
pallet-message-queue = { version = "52.0.0", default-features = false }
pallet-migrations = { version = "19.0.0", default-features = false }
parachain-info = { version = "0.28.0", package = "staging-parachain-info", default-features = false }
parachains-common = { version = "36.0.0", default-features = false }

# Polkadot
polkadot-primitives = { version = "25.0.0", default-features = false }

# Polkadot Dependencies
pallet-xcm = { version = "29.1.0", default-features = false }
pallet-xcm-benchmarks = { version = "29.0.0", default-features = false }
polkadot-core-primitives = { version = "24.0.0", default-features = false }
polkadot-parachain-primitives = { version = "23.0.0", default-features = false }
polkadot-runtime-common = { version = "31.0.0", default-features = false }
xcm = { version = "24.1.0", package = "staging-xcm", default-features = false }
xcm-builder = { version = "29.0.1", package = "staging-xcm-builder", default-features = false }
xcm-runtime-apis = { version = "0.16.0", default-features = false }
xcm-executor = { version = "28.0.1", package = "staging-xcm-executor", default-features = false }

# ink!
ink = { version = "5.1.1", default-features = false }
ink_env = { version = "5.1.1", default-features = false }

[workspace.lints.clippy]

