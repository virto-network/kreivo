name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install solidity dependencies
        run: |
          # Install official Solidity compiler binary
          curl -L -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            && chmod +x /usr/local/bin/solc
          # Install Parity resolc binary
          curl -L -o /usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v1.0.0/resolc-x86_64-unknown-linux-musl \
            && chmod +x /usr/local/bin/resolc

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32v1-none
          components: rust-src

      - name: Install 1.91 toolchain (for revive fixtures)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.91
          target: wasm32v1-none
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: build

      - name: Production build
        uses: actions-rs/cargo@v1
        with:
          command: build
          toolchain: 1.89
          args: --profile production ${{ contains(github.ref, '-pre') && '--features paseo' || '' }} --locked -p kreivo-runtime

      - name: Upload runtime to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-runtime
          path: ./target/production/wbuild/kreivo-runtime/kreivo_runtime.compact.compressed.wasm
        env:
          PALLET_REVIVE_FIXTURES_RUSTUP_TOOLCHAIN: 1.91

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.run_number }}-runtime

      - name: Generate release notes
        env:
          ENDPOINT: ${{ contains(github.ref, '-pre') && 'testnet.virto.dev' || 'kreivo.io' }}
        run: |
          HASH=$(b2sum -l256 kreivo_runtime.compact.compressed.wasm | awk '{print $1}')

          echo "You can create the \`authorizeUpgrade\` extrinsic [here](https://polkadot.js.org/apps/?rpc=wss%3A%2F%2F"$ENDPOINT"#/extrinsics/decode/0x0009"$HASH")." \
            >> RELEASE_NOTES.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-pre') }}
          body_path: RELEASE_NOTES.txt
          append_body: true
          files: |
            kreivo_runtime.compact.compressed.wasm
