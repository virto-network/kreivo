name: Run Check Migrations
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install solidity dependencies
        run: |
          # Install official Solidity compiler binary
          curl -L -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            && chmod +x /usr/local/bin/solc
          # Install Parity resolc binary
          curl -L -o /usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v1.0.0/resolc-x86_64-unknown-linux-musl \
            && chmod +x /usr/local/bin/resolc

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rust-src

      - name: Install 1.91 toolchain (for revive fixtures)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.91
          target: wasm32-unknown-unknown
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: build

      - name: Release build with try-runtime
        uses: actions-rs/cargo@v1
        with:
          command: build
          toolchain: stable
          args: --profile production --features ${{ github.ref_name == 'dev' && 'paseo,try-runtime' || 'try-runtime' }} --locked -p kreivo-runtime
        env:
          PALLET_REVIVE_FIXTURES_RUSTUP_TOOLCHAIN: 1.91

      - name: Upload runtime to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-runtime
          path: ./target/production/wbuild/kreivo-runtime/kreivo_runtime.compact.compressed.wasm

  check_migrations:
    name: Check Migrations
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.run_number }}-runtime

      - name: Download CLI
        run: |
          curl -sL https://github.com/paritytech/try-runtime-cli/releases/download/v0.10.1/try-runtime-x86_64-unknown-linux-musl -o try-runtime
          chmod +x ./try-runtime
          echo "Using try-runtime-cli version:"
          ./try-runtime --version

      - name: Get Date
        id: get-date
        run: |
          echo "today=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download Snapshot
        uses: actions/cache@v4
        with:
          path: snapshot.raw
          key: try-runtime-snapshot-${{ matrix.network }}-${{ steps.get-date.outputs.today }}
          save-always: true

      - name: Create Snapshot If Stale
        if: ${{ hashFiles('snapshot.raw') == '' }}
        run: |
          echo "Creating new snapshot for today (${{ steps.get-date.outputs.today }})"
          ./try-runtime create-snapshot --uri="wss://kreivo.kippu.rocks" snapshot.raw

      - run: |
          ./try-runtime --runtime kreivo_runtime.compact.compressed.wasm \
            on-runtime-upgrade --disable-spec-version-check --checks=all --blocktime 6000 \
            snap -p snapshot.raw
