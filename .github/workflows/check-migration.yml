name: Run Check Migrations
on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Release gate: run it by hand on the commit about to be released, against a snapshot of the
  # live chain (`fresh-snapshot` takes a new one instead of reusing today's cached snapshot).
  workflow_dispatch:
    inputs:
      fresh-snapshot:
        description: "Take a new snapshot of the live chain instead of reusing today's cached one"
        type: boolean
        default: false

env:
  # The live Kreivo chain (Kusama, para 2281) the runtime upgrade is checked against.
  SNAPSHOT_URI: wss://kreivo.kippu.rocks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: build

      - name: Release build with try-runtime
        uses: actions-rs/cargo@v1
        with:
          command: build
          toolchain: stable
          args: --profile production --features ${{ github.ref_name == 'dev' && 'paseo,try-runtime' || 'try-runtime' }} --locked -p kreivo-runtime
        env:
          # pallet-revive is out of the runtime, but assets-common still builds its fixtures
          # under runtime-benchmarks, which would need solc and resolc.
          SKIP_PALLET_REVIVE_FIXTURES: 1

      - name: Upload runtime to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_number }}-runtime
          path: ./target/production/wbuild/kreivo-runtime/kreivo_runtime.compact.compressed.wasm

  check_migrations:
    name: Check Migrations
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.run_number }}-runtime

      - name: Download CLI
        run: |
          curl -sL https://github.com/paritytech/try-runtime-cli/releases/download/v0.10.1/try-runtime-x86_64-unknown-linux-musl -o try-runtime
          chmod +x ./try-runtime
          echo "Using try-runtime-cli version:"
          ./try-runtime --version

      - name: Get Date
        id: get-date
        run: |
          echo "today=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"
        shell: bash

      # One snapshot of the live chain per day. It is restored and saved in separate steps (rather
      # than `actions/cache` with the deprecated `save-always`) so that it is saved as soon as it is
      # taken, even when the migration checks below fail. Caches saved on `master` are visible to
      # every PR; those saved on a PR only to that PR.
      - name: Restore Snapshot
        id: snapshot
        if: ${{ !inputs.fresh-snapshot }}
        uses: actions/cache/restore@v4
        with:
          path: snapshot.raw
          key: try-runtime-snapshot-kreivo-${{ steps.get-date.outputs.today }}

      - name: Create Snapshot If Stale
        id: create-snapshot
        if: ${{ steps.snapshot.outputs.cache-hit != 'true' }}
        run: |
          echo "Creating a new snapshot of $SNAPSHOT_URI for today (${{ steps.get-date.outputs.today }})"
          rm -f snapshot.raw
          ./try-runtime create-snapshot --uri="$SNAPSHOT_URI" snapshot.raw

      - name: Save Snapshot
        if: ${{ steps.create-snapshot.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: snapshot.raw
          key: try-runtime-snapshot-kreivo-${{ steps.get-date.outputs.today }}

      - name: Summary
        run: |
          {
            echo "### Check Migrations"
            echo "- Runtime: \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)"
            echo "- Snapshot: $SNAPSHOT_URI, ${{ steps.snapshot.outputs.cache-hit == 'true' && 'restored from the cache of' || 'taken on' }} ${{ steps.get-date.outputs.today }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - run: |
          ./try-runtime --runtime kreivo_runtime.compact.compressed.wasm \
            on-runtime-upgrade --disable-spec-version-check --checks=all --blocktime 6000 \
            snap -p snapshot.raw
