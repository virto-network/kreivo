name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_VERSION: 'nightly'
  EXTRA_ARGS: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          # Install `protoc`
          sudo apt install -y protobuf-compiler
          # Install official Solidity compiler binary
          curl -L -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            && chmod +x /usr/local/bin/solc
          # Install Parity resolc binary
          curl -L -o /usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v1.0.0/resolc-x86_64-unknown-linux-musl \
            && chmod +x /usr/local/bin/resolc

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.NIGHTLY_VERSION }}
          target: wasm32-unknown-unknown
          components: rust-src

      - name: Install 1.91 toolchain (for revive fixtures)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.91
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: check

      - name: Check Build
        uses: actions-rs/cargo@v1
        with:
          command: check
          toolchain: ${{ env.NIGHTLY_VERSION }}
          args: --release --locked --all-features --workspace ${{ env.EXTRA_ARGS }}
        env:
          PALLET_REVIVE_FIXTURES_RUSTUP_TOOLCHAIN: 1.91

  clippy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Install dependencies
        run: |
          # Install `protoc`
          sudo apt install -y protobuf-compiler
          # Install official Solidity compiler binary
          curl -L -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            && chmod +x /usr/local/bin/solc
          # Install Parity resolc binary
          curl -L -o /usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v1.0.0/resolc-x86_64-unknown-linux-musl \
            && chmod +x /usr/local/bin/resolc

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.NIGHTLY_VERSION }}
          target: wasm32-unknown-unknown
          components: rust-src,clippy

      - name: Install 1.91 toolchain (for revive fixtures)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.91
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: check

      - name: Annotate with Clippy warnings
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: ${{ env.NIGHTLY_VERSION }}
          args: --release --locked --all-features --workspace ${{ env.EXTRA_ARGS }}
        env:
          PALLET_REVIVE_FIXTURES_RUSTUP_TOOLCHAIN: 1.91

  test:
    runs-on: ubuntu-latest
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Install dependencies
        run: |
          # Install `protoc`
          sudo apt install -y protobuf-compiler
          # Install official Solidity compiler binary
          curl -L -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux \
            && chmod +x /usr/local/bin/solc
          # Install Parity resolc binary
          curl -L -o /usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v1.0.0/resolc-x86_64-unknown-linux-musl \
            && chmod +x /usr/local/bin/resolc

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.NIGHTLY_VERSION }}
          target: wasm32-unknown-unknown
          components: rust-src

      - name: Install 1.91 toolchain (for revive fixtures)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.91
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: test

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          toolchain: ${{ env.NIGHTLY_VERSION }}
          args: --lib --locked --all-features --workspace ${{ env.EXTRA_ARGS }}
        env:
          PALLET_REVIVE_FIXTURES_RUSTUP_TOOLCHAIN: 1.91
